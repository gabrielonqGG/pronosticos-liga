<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats Liga Profesional - Simulador por Fecha</title>
    <style>
        :root {
            --bg-body: #064e3b; --bg-card: #065f46; --text-main: #f8fafc;
            --text-muted: #a7f3d0; --border: #047857; --accent: #34d399;
            --hover-row: rgba(52, 211, 153, 0.1); --sticky-bg: #065f46;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --champ: 251, 191, 36; --lib: 16, 185, 129;
            --sud: 59, 130, 246; --rel: 239, 68, 68;
            --sim-bg: #022c22;
        }

        [data-theme="light"] {
            --bg-body: #f8fafc; --bg-card: #ffffff; --text-main: #0f172a;
            --text-muted: #475569; --border: #cbd5e1; --accent: #0284c7;
            --hover-row: rgba(2, 132, 199, 0.05); --sticky-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); --sim-bg: #f1f5f9;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px 10px; transition: 0.3s; }
        .header-controls { max-width: 1200px; margin: 0 auto 20px auto; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        h1 { margin: 0; font-size: 24px; text-align: center; }
        .timestamp { color: var(--accent); font-weight: 600; font-size: 13px; margin-top: 6px; text-align: center; }

        .toolbar { display: flex; justify-content: space-between; width: 100%; flex-wrap: wrap; gap: 10px; }
        .search-box { flex: 1; min-width: 200px; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); outline: none; }
        .btn { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: var(--hover-row); }
        .btn-sim { background: var(--accent); color: #064e3b; border: none; }
        .btn-sim:hover { filter: brightness(1.1); }

        .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: var(--accent); color: #064e3b; border-color: var(--accent); }

        .simulator-panel { display: none; background: var(--sim-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin: 0 auto 20px auto; max-width: 750px; box-shadow: var(--shadow); }
        .simulator-panel.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        
        .fecha-nav { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; }
        .fecha-arrow { background: none; border: none; color: var(--text-main); font-size: 18px; cursor: pointer; padding: 0 10px; }
        .fecha-arrow:hover { color: var(--accent); }

        .match-card { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
        .match-date { font-size: 12px; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 4px; color: var(--text-muted); width: 85px; text-align: center; }
        .match-teams { flex: 1; display: flex; justify-content: space-between; align-items: center; min-width: 250px; font-weight: 600; font-size: 14px; }
        .team-home { text-align: right; flex: 1; padding-right: 10px; }
        .team-vis { text-align: left; flex: 1; padding-left: 10px; }
        .score-input { width: 35px; height: 32px; text-align: center; font-weight: bold; font-size: 14px; background: var(--bg-body); color: var(--text-main); border: 1px solid var(--border); border-radius: 6px; outline: none; }
        
        .sim-actions-footer { display: flex; justify-content: space-between; margin-top: 15px; flex-wrap: wrap; gap: 10px; }

        .table-container { max-width: 1200px; margin: 0 auto; display: none; background: var(--bg-card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
        .table-container.active { display: block; }
        .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; text-align: center; }
        th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { color: var(--text-muted); font-size: 12px; cursor: pointer; }
        th:hover { color: var(--accent); }
        th:first-child, td:first-child { position: sticky; left: 0; z-index: 2; background: var(--sticky-bg); text-align: left; padding-left: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }
        th:first-child { z-index: 3; }
        tbody tr:hover td { background: var(--hover-row); }
        
        .pos { display: inline-block; width: 24px; color: var(--text-muted); font-size: 12px; }
        .team-name { font-weight: 600; }
        .stat-pts { font-weight: bold; color: var(--text-main); font-size: 15px; }
        .pct-cell { font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .pct-0 { color: var(--border); font-weight: normal; text-shadow: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header-controls">
        <div>
            <h1>⚽ Stats Liga Profesional</h1>
            <div id="lastUpdate" class="timestamp">⏳ Cargando datos...</div>
        </div>
        <div class="toolbar">
            <input type="text" id="searchInput" class="search-box" placeholder="Buscar equipo...">
            <button id="toggleSim" class="btn btn-sim">🔮 Simulador por Fecha</button>
            <button id="themeToggle" class="btn">🌓 Tema</button>
        </div>
    </div>

    <div id="simulatorPanel" class="simulator-panel">
        <div class="fecha-nav">
            <button class="fecha-arrow" onclick="cambiarFecha(-1)">&#10094;</button>
            <div id="tituloFecha">Fecha 10</div>
            <button class="fecha-arrow" onclick="cambiarFecha(1)">&#10095;</button>
        </div>
        <div id="matchdayContainer"></div>
        <div class="sim-actions-footer">
            <button class="btn btn-sim" onclick="completarRestantes()">Completar restantes</button>
            <button class="btn" onclick="resetSim()">Restablecer resultados</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-target="anual">Tabla Anual</button>
        <button class="tab-btn" data-target="zonaA">Clausura - Zona A</button>
        <button class="tab-btn" data-target="zonaB">Clausura - Zona B</button>
    </div>

    <div id="anual" class="table-container active"><div class="table-wrapper"><table id="table-anual"></table></div></div>
    <div id="zonaA" class="table-container"><div class="table-wrapper"><table id="table-zonaA"></table></div></div>
    <div id="zonaB" class="table-container"><div class="table-wrapper"><table id="table-zonaB"></table></div></div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
        themeToggle.addEventListener('click', () => {
            let switchTo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', switchTo);
            localStorage.setItem('theme', switchTo);
        });

        let apiData = { anual: [], zonaA: [], zonaB: [] };
        let currentData = { anual: [], zonaA: [], zonaB: [] };
        let currentTab = 'anual';
        let sortConfig = { key: 'pts', asc: false };
        let isSimMode = false;
        let fechaActualIndex = 0;
        let fixtureRestante = [];

        const thAnual = `<thead><tr><th data-key="pos">#</th><th data-key="name">Equipo</th><th data-key="pj">PJ</th><th data-key="pg">G</th><th data-key="pe">E</th><th data-key="pp">P</th><th data-key="dg">DG</th><th data-key="pts">PTS</th><th data-key="champ">🏆 CAMP</th><th data-key="lib">🌎 LIB</th><th data-key="sud">✈️ SUD</th><th data-key="rel">⬇️ DESC</th></tr></thead><tbody></tbody>`;
        const thZonas = `<thead><tr><th data-key="pos">#</th><th data-key="name">Equipo</th><th data-key="pj">PJ</th><th data-key="pg">G</th><th data-key="pe">E</th><th data-key="pp">P</th><th data-key="dg">DG</th><th data-key="pts">PTS</th><th data-key="playoff">✅ PLAYOFFS</th></tr></thead><tbody></tbody>`;

        document.getElementById('table-anual').innerHTML = thAnual;
        document.getElementById('table-zonaA').innerHTML = thZonas;
        document.getElementById('table-zonaB').innerHTML = thZonas;

        fetch(`pronosticos.json?v=${new Date().getTime()}`)
            .then(res => res.json())
            .then(data => {
                apiData = JSON.parse(JSON.stringify(data));
                currentData = JSON.parse(JSON.stringify(data));
                if(data.ultima_actualizacion) document.getElementById('lastUpdate').innerText = "🔄 Actualizado: " + data.ultima_actualizacion;
                
                generarFixtureDinamico();
                renderizarFecha();
                renderAll();
                setupSortListeners();
            });

        // --- GENERADOR DE FIXTURE DINÁMICO (7 Fechas Restantes, 15 partidos c/u) ---
        function generarFixtureDinamico() {
            let equipos = apiData.anual.map(t => t.name);
            fixtureRestante = [];
            let fechaBase = new Date(2026, 8, 18); // 18 de septiembre 2026

            for (let f = 1; f <= 7; f++) {
                let partidosFecha = [];
                let disponibles = [...equipos];
                // Rotación inteligente para simular emparejamientos lógicos
                let rotados = disponibles.slice(f % 15).concat(disponibles.slice(0, f % 15));
                
                for (let i = 0; i < 15; i++) {
                    let loc = rotados[i];
                    let vis = rotados[rotados.length - 1 - i];
                    let d = new Date(fechaBase);
                    d.setDate(d.getDate() + (f - 1) * 3 + Math.floor(i / 5));
                    
                    partidosFecha.push({
                        fecha: d.toLocaleDateString('es-AR'),
                        local: loc,
                        visita: vis,
                        gl: null,
                        gv: null
                    });
                }
                fixtureRestante.push({ titulo: `Fecha ${9 + f}`, partidos: partidosFecha });
            }
        }

        // --- MATEMÁTICA SOFTMAX DISTRIBUIDA (Evita porcentajes inflados) ---
        function recalcularProbabilidades(datos, tipo) {
            let total = datos.length;
            if (total === 0) return;
            let pj_total = tipo === "anual" ? 32 : 16;
            
            datos.sort((a, b) => b.pts !== a.pts ? b.pts - a.pts : b.dg - a.dg);
            datos.forEach((eq, i) => eq.pos = i + 1);

            datos.forEach(eq => {
                let pj_res = Math.max(0, pj_total - eq.pj);
                let ppg = eq.pj > 0 ? eq.pts / eq.pj : 1.3;
                eq.mu = eq.pts + (pj_res * ppg);
                eq.pmax = eq.pts + (pj_res * 3);
                eq.pmin = eq.pts;
                eq.pj_res = pj_res;
            });

            function calcular_softmax(slots, pts_corte, es_descenso = false) {
                let pesos = [];
                let max_mu = Math.max(...datos.map(d => d.mu));
                
                datos.forEach(eq => {
                    let alpha = 1.8 / Math.max(1, eq.pj_res); // Temperatura balanceada para distribución real
                    if (!es_descenso) {
                        if (eq.pmax < pts_corte) pesos.push(0.0);
                        else if (eq.pj_res === 0 && eq.pts >= pts_corte) pesos.push(1000);
                        else pesos.push(Math.exp(alpha * (eq.mu - max_mu)));
                    } else {
                        if (eq.pmin > pts_max_descenso) pesos.push(0.0);
                        else if (eq.pj_res === 0 && eq.pts <= pts_max_descenso) pesos.push(1000);
                        else pesos.push(Math.exp(-alpha * (eq.mu - max_mu)));
                    }
                });

                let suma = pesos.reduce((a, b) => a + b, 0);
                if (suma === 0) return Array(total).fill(0.0);
                
                let probs = pesos.map(w => (w / suma) * slots * 100.0);
                return probs.map(p => Math.min(100.0, Math.max(0.0, p)));
            }

            let pts_1 = datos[0]?.pts || 0;
            let pts_3 = datos[2]?.pts || 0;
            let pts_8 = datos[7]?.pts || 0;
            let pts_9 = datos[8]?.pts || 0;
            let pts_max_descenso = total > 1 ? datos[total-2].pmax : 0;

            if (tipo === "anual") {
                let p1 = calcular_softmax(1, pts_1);
                let p3 = calcular_softmax(3, pts_3);
                let p9 = calcular_softmax(9, pts_9);
                let pDesc = calcular_softmax(2, 0, true);

                datos.forEach((eq, i) => {
                    let c1 = p1[i];
                    let c3 = Math.max(c1, p3[i]);
                    let c9 = Math.max(c3, p9[i]);
                    
                    eq.champ = c1;
                    eq.lib = c3 - c1;
                    eq.sud = c9 - c3;
                    eq.rel = pDesc[i];
                });
            } else {
                let p8 = calcular_softmax(8, pts_8);
                datos.forEach((eq, i) => {
                    eq.playoff = p8[i];
                });
            }
        }

        // --- GESTIÓN DE FECHAS SIMULADOR ---
        document.getElementById('toggleSim').addEventListener('click', () => {
            isSimMode = !isSimMode;
            document.getElementById('simulatorPanel').classList.toggle('active', isSimMode);
        });

        function cambiarFecha(dir) {
            fechaActualIndex += dir;
            if (fechaActualIndex < 0) fechaActualIndex = 0;
            if (fechaActualIndex >= fixtureRestante.length) fechaActualIndex = fixtureRestante.length - 1;
            renderizarFecha();
        }

        function renderizarFecha() {
            let f = fixtureRestante[fechaActualIndex];
            document.getElementById('tituloFecha').innerText = f.titulo + ` (${fechaActualIndex + 1} de ${fixtureRestante.length})`;
            let html = "";
            f.partidos.forEach((p, idx) => {
                html += `<div class="match-card">
                    <div class="match-date">${p.fecha}</div>
                    <div class="match-teams">
                        <span class="team-home">${p.local}</span>
                        <div>
                            <input type="number" class="score-input" min="0" value="${p.gl !== null ? p.gl : ''}" onchange="actualizarPartido(${fechaActualIndex}, ${idx}, 'gl', this.value)">
                            <span>-</span>
                            <input type="number" class="score-input" min="0" value="${p.gv !== null ? p.gv : ''}" onchange="actualizarPartido(${fechaActualIndex}, ${idx}, 'gv', this.value)">
                        </div>
                        <span class="team-vis">${p.visita}</span>
                    </div>
                </div>`;
            });
            document.getElementById('matchdayContainer').innerHTML = html;
        }

        function actualizarPartido(fIdx, pIdx, campo, val) {
            let match = fixtureRestante[fIdx].partidos[pIdx];
            match[campo] = val === "" ? null : parseInt(val);
            recalcularTablaTotal();
        }

        function completarRestantes() {
            let f = fixtureRestante[fechaActualIndex];
            f.partidos.forEach(p => {
                if(p.gl === null) p.gl = Math.floor(Math.random() * 3);
                if(p.gv === null) p.gv = Math.floor(Math.random() * 3);
            });
            renderizarFecha();
            recalcularTablaTotal();
        }

        function resetSim() {
            currentData = JSON.parse(JSON.stringify(apiData));
            fixtureRestante.forEach(f => f.partidos.forEach(p => { p.gl = null; p.gv = null; }));
            renderizarFecha();
            renderAll();
        }

        function recalcularTablaTotal() {
            currentData = JSON.parse(JSON.stringify(apiData));
            
            fixtureRestante.forEach(f => {
                f.partidos.forEach(p => {
                    if(p.gl !== null && p.gv !== null) {
                        ['anual', 'zonaA', 'zonaB'].forEach(zona => {
                            let loc = currentData[zona].find(t => t.name.toLowerCase() === p.local.toLowerCase());
                            let vis = currentData[zona].find(t => t.name.toLowerCase() === p.visita.toLowerCase());
                            if(loc && vis) {
                                loc.pj++; vis.pj++;
                                loc.dg += (p.gl - p.gv); vis.dg += (p.gv - p.gl);
                                if(p.gl > p.gv) { loc.pts += 3; loc.pg++; vis.pp++; }
                                else if(p.gl < p.gv) { vis.pts += 3; vis.pg++; loc.pp++; }
                                else { loc.pts += 1; vis.pts += 1; loc.pe++; vis.pe++; }
                            }
                        });
                    }
                });
            });

            ['anual', 'zonaA', 'zonaB'].forEach(zona => {
                recalcularProbabilidades(currentData[zona], zona === 'anual' ? 'anual' : 'zona');
            });
            renderAll();
        }

        // --- RENDERIZADO TABLAS ---
        function getBg(val, color) { return (!val || val <= 0.01) ? 'transparent' : `rgba(var(--${color}), ${Math.max(0.15, val/100)})`; }
        function fmt(val) { return (!val || val <= 0.01) ? '<span class="pct-0">-</span>' : `${val.toFixed(2)}%`; }

        function renderTable(tabId) {
            const table = document.getElementById(`table-${tabId}`);
            const tbody = table.querySelector('tbody');
            tbody.innerHTML = '';
            
            let data = [...currentData[tabId]];
            data.sort((a, b) => {
                let vA = a[sortConfig.key], vB = b[sortConfig.key];
                if(typeof vA === 'string') return sortConfig.asc ? vA.localeCompare(vB) : vB.localeCompare(vA);
                return sortConfig.asc ? vA - vB : vB - vA;
            });

            const query = document.getElementById('searchInput').value.toLowerCase();
            if (query) data = data.filter(t => t.name.toLowerCase().includes(query));

            data.forEach(t => {
                let probs = tabId === 'anual' 
                    ? `<td class="pct-cell" style="background:${getBg(t.champ,'champ')}">${fmt(t.champ)}</td>
                       <td class="pct-cell" style="background:${getBg(t.lib,'lib')}">${fmt(t.lib)}</td>
                       <td class="pct-cell" style="background:${getBg(t.sud,'sud')}">${fmt(t.sud)}</td>
                       <td class="pct-cell" style="background:${getBg(t.rel,'rel')}">${fmt(t.rel)}</td>`
                    : `<td class="pct-cell" style="background:${getBg(t.lib,'lib')}">${fmt(t.playoff)}</td>`;

                tbody.innerHTML += `<tr>
                    <td><span class="pos">${t.pos}</span></td><td class="team-name">${t.name}</td>
                    <td>${t.pj}</td><td>${t.pg}</td><td>${t.pe}</td><td>${t.pp}</td>
                    <td style="color:var(--text-muted);">${t.dg > 0 ? '+'+t.dg : t.dg}</td><td class="stat-pts">${t.pts}</td>${probs}
                </tr>`;
            });
            table.querySelectorAll('th').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.getAttribute('data-key') === sortConfig.key) th.classList.add(sortConfig.asc ? 'sort-asc' : 'sort-desc');
            });
        }

        function renderAll() { ['anual', 'zonaA', 'zonaB'].forEach(renderTable); }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn, .table-container').forEach(el => el.classList.remove('active'));
                e.target.classList.add('active');
                currentTab = e.target.getAttribute('data-target');
                document.getElementById(currentTab).classList.add('active');
                sortConfig = { key: 'pos', asc: true }; renderAll();
            });
        });

        document.getElementById('searchInput').addEventListener('input', renderAll);
        function setupSortListeners() {
            document.querySelectorAll('th[data-key]').forEach(th => {
                th.addEventListener('click', () => {
                    let key = th.getAttribute('data-key');
                    if(sortConfig.key === key) sortConfig.asc = !sortConfig.asc;
                    else { sortConfig.key = key; sortConfig.asc = key === 'name'; }
                    renderAll();
                });
            });
        }
    </script>
</body>
</html>
