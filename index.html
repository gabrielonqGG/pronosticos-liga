<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronósticos de Temporada - Liga Argentina</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #43aa8b;
        }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; 
            padding: 10px; 
        }
        header { 
            text-align: center; 
            padding: 20px 0 10px 0; 
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .subtitle { color: var(--text-muted); font-size: 14px; margin-top: 5px; }
        
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }
        .tab-btn:hover { background: var(--bg-hover); color: var(--text-main); }
        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .table-container { 
            overflow-x: auto;
            border-radius: 8px; 
            background: var(--bg-card);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            display: none;
        }
        .table-container.active { display: block; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 850px; 
            text-align: center; 
        }
        th, td { 
            padding: 10px 8px; 
            border-bottom: 1px solid var(--border); 
            font-size: 13px; 
        }
        th { 
            color: var(--text-muted); 
            font-weight: 600; 
            font-size: 11px; 
            text-transform: uppercase; 
        }
        .team-cell { 
            text-align: left; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            min-width: 150px;
        }
        .pos { 
            color: var(--text-muted); 
            width: 20px; 
            display: inline-block; 
            text-align: right; 
            font-size: 12px;
            font-weight: normal;
        }
        
        .stat-col { color: var(--text-muted); }
        .stat-pts { font-weight: bold; color: var(--text-main); font-size: 14px; }
        
        .pct-cell { font-weight: 600; color: #fff; text-shadow: 0px 1px 2px rgba(0,0,0,0.4); }
        .pct-0 { color: var(--border); font-weight: normal; text-shadow: none; }
    </style>
</head>
<body>
    <header>
        <h1>⚽ Stats Liga Profesional</h1>
        <div class="subtitle">Pronósticos y posiciones actualizadas</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('anual', this)">Tabla Anual</button>
        <button class="tab-btn" onclick="showTab('zonaA', this)">Clausura - Zona A</button>
        <button class="tab-btn" onclick="showTab('zonaB', this)">Clausura - Zona B</button>
    </div>

    <div id="anual" class="table-container active">
        <table>
            <thead>
                <tr>
                    <th style="text-align: left; padding-left: 20px;">Equipo</th>
                    <th title="Partidos Jugados">PJ</th><th title="Ganados">G</th><th title="Empatados">E</th><th title="Perdidos">P</th><th title="Diferencia de Goles">DG</th><th title="Puntos actuales">PTS</th>
                    <th title="Probabilidad de salir campeón anual">🏆 Camp</th>
                    <th title="Probabilidad de quedar entre los puestos 1 y 3">🌎 Lib (1-3)</th>
                    <th title="Probabilidad de quedar entre los puestos 4 y 9">✈️ Sud (4-9)</th>
                    <th title="Probabilidad de quedar en zona de descenso (últimos 2)">⬇️ Desc</th>
                </tr>
            </thead>
            <tbody id="body-anual"></tbody>
        </table>
    </div>

    <div id="zonaA" class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="text-align: left; padding-left: 20px;">Equipo</th>
                    <th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>PTS</th>
                    <th title="Probabilidad de clasificar a Playoffs (1-8)">✅ Playoffs (1-8)</th>
                </tr>
            </thead>
            <tbody id="body-zonaA"></tbody>
        </table>
    </div>

    <div id="zonaB" class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="text-align: left; padding-left: 20px;">Equipo</th>
                    <th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>PTS</th>
                    <th title="Probabilidad de clasificar a Playoffs (1-8)">✅ Playoffs (1-8)</th>
                </tr>
            </thead>
            <tbody id="body-zonaB"></tbody>
        </table>
    </div>

    <script>
        function getColorOpacity(value, baseColor) {
            if (!value || value === 0) return 'transparent';
            const opacity = Math.max(0.15, (value / 100) * 0.85);
            return `rgba(${baseColor}, ${opacity})`;
        }

        function formatPct(val) {
            return (!val || val === 0) ? '<span class="pct-0">-</span>' : `${val.toFixed(1)}%`;
        }

        function renderTable(tbodyId, data, isZone) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = "";
            if (!data) return;
            
            const colorChamp = "251, 191, 36"; 
            const colorLib = "16, 185, 129";   
            const colorSud = "59, 130, 246";   
            const colorRel = "239, 68, 68";    

            data.forEach(t => {
                let probsHtml = '';
                if (!isZone) {
                    probsHtml = `
                        <td class="pct-cell" style="background-color: ${getColorOpacity(t.champ, colorChamp)}">${formatPct(t.champ)}</td>
                        <td class="pct-cell" style="background-color: ${getColorOpacity(t.lib, colorLib)}">${formatPct(t.lib)}</td>
                        <td class="pct-cell" style="background-color: ${getColorOpacity(t.sud, colorSud)}">${formatPct(t.sud)}</td>
                        <td class="pct-cell" style="background-color: ${getColorOpacity(t.rel, colorRel)}">${formatPct(t.rel)}</td>
                    `;
                } else {
                    probsHtml = `
                        <td class="pct-cell" style="background-color: ${getColorOpacity(t.playoff, colorLib)}">${formatPct(t.playoff)}</td>
                    `;
                }

                tbody.innerHTML += `
                    <tr>
                        <td class="team-cell" style="padding-left: 20px;">
                            <span class="pos">${t.pos}</span> ${t.name}
                        </td>
                        <td class="stat-col">${t.pj}</td>
                        <td class="stat-col">${t.pg}</td>
                        <td class="stat-col">${t.pe}</td>
                        <td class="stat-col">${t.pp}</td>
                        <td class="stat-col" style="font-weight: 500;">${t.dg > 0 ? '+'+t.dg : t.dg}</td>
                        <td class="stat-pts">${t.pts}</td>
                        ${probsHtml}
                    </tr>
                `;
            });
        }

        function showTab(tabId, btn) {
            document.querySelectorAll('.table-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        fetch('pronosticos.json')
            .then(response => response.json())
            .then(data => {
                if(data.anual) renderTable('body-anual', data.anual, false);
                if(data.zonaA) renderTable('body-zonaA', data.zonaA, true);
                if(data.zonaB) renderTable('body-zonaB', data.zonaB, true);
            })
            .catch(error => console.error("Falta generar el JSON:", error));
    </script>
</body>
</html>
