<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronósticos de Temporada - Liga Argentina</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #43aa8b;
        }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; 
            padding: 10px; 
        }
        header { 
            text-align: center; 
            padding: 20px 0 10px 0; 
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .subtitle { color: var(--text-muted); font-size: 14px; margin-top: 5px; }
        
        /* Sistema de Pestañas (Tabs) */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }
        .tab-btn:hover { background: var(--bg-hover); color: var(--text-main); }
        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .table-container { 
            overflow-x: auto;
            border-radius: 8px; 
            background: var(--bg-card);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            display: none; /* Se ocultan por defecto, JS muestra la activa */
        }
        .table-container.active { display: block; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 850px; /* Ancho ampliado para las nuevas columnas */
            text-align: center; 
        }
        th, td { 
            padding: 10px 8px; 
            border-bottom: 1px solid var(--border); 
            font-size: 13px; 
        }
        th { 
            color: var(--text-muted); 
            font-weight: 600; 
            font-size: 11px; 
            text-transform: uppercase; 
        }
        .team-cell { 
            text-align: left; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            min-width: 150px;
        }
        .pos { 
            color: var(--text-muted); 
            width: 20px; 
            display: inline-block; 
            text-align: right; 
            font-size: 12px;
            font-weight: normal;
        }
        
        .stat-col { color: var(--text-muted); }
        .stat-pts { font-weight: bold; color: var(--text-main); font-size: 14px; }
        
        /* Celdas de probabilidad */
        .pct-cell { font-weight: 600; color: #fff; text-shadow: 0px 1px 2px rgba(0,0,0,0.4); }
        .pct-0 { color: var(--border); font-weight: normal; text-shadow: none; }
    </style>
</head>

            const opacity = Math.max(0.15, (value / 100) * 0.85);
            return `rgba(${baseColor}, ${opacity})`;
